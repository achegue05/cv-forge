<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CV Forge</title>
<meta name="description" content="Crea, personaliza y descarga tu CV en formato Harvard y otros. Editor de texto enriquecido, plantillas, análisis ATS y exportación a PDF, Word, HTML y Markdown. Gratis, sin registro y sin enviar tus datos a ningún servidor." />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230B0B0C'/%3E%3Crect x='7' y='6' width='18' height='20' fill='%23ECECEE'/%3E%3Crect x='10' y='10' width='12' height='2' fill='%230B0B0C'/%3E%3Crect x='10' y='15' width='12' height='1.5' fill='%236C6D76'/%3E%3Crect x='10' y='19' width='8' height='1.5' fill='%236C6D76'/%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@400;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,700;1,400&family=Merriweather:ital,wght@0,400;0,700;1,400&family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Inter:wght@300;400;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=Lato:ital,wght@0,300;0,400;0,700;1,400&family=Roboto:ital,wght@0,400;0,700;1,400&family=Open+Sans:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@400;600;700&family=Poppins:wght@400;600;700&family=Work+Sans:wght@400;600;700&family=Karla:wght@400;700&family=Raleway:wght@400;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/app.css" />
</head>
<body>

<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>

<div id="app">

  <header class="topbar glass">
    <div class="brand">
      <span class="brand-mark">CV</span>
      <span class="brand-text">
        <span class="brand-name">Forge</span>
        <span class="brand-sub" id="brand-sub">editor de currículum</span>
      </span>
    </div>

    <div class="dropdown" id="docs-drop">
      <button class="doc-chip" data-drop="docs-drop">
        <span id="doc-name">CV</span>
      </button>
      <div class="drop-panel" id="docs-menu"></div>
    </div>
    <span class="save-status" id="save-status"></span>

    <div class="topbar-actions">
      <button class="btn" data-action="load-example" data-i18n="example">Cargar ejemplo</button>
      <button class="btn" data-action="new-cv" data-i18n="blank">Empezar en blanco</button>
      <button class="btn" data-action="import" data-i18n="openFile">Abrir archivo</button>

      <div class="dropdown drop-right" id="export-drop">
        <button class="btn has-drop" data-drop="export-drop" data-i18n="exportMenu">Exportar</button>
        <div class="drop-panel">
          <button class="menu-item" data-action="export-docx" data-i18n="exportDocx">Documento Word</button>
          <button class="menu-item" data-action="export-html" data-i18n="exportHtml">Página HTML</button>
          <button class="menu-item" data-action="export-txt" data-i18n="exportTxt">Texto plano</button>
          <button class="menu-item" data-action="export-md" data-i18n="exportMd">Markdown</button>
          <button class="menu-item" data-action="export-json" data-i18n="exportJson">Archivo del proyecto</button>
        </div>
      </div>

      <button class="btn btn-primary" data-action="print" data-i18n="downloadPdf">Descargar PDF</button>

      <span class="seg" role="group">
        <button data-action="lang" data-lang-btn="es">ES</button>
        <button data-action="lang" data-lang-btn="en">EN</button>
      </span>
      <button class="icon-round" data-action="theme" data-i18n-title="theme" title="Tema"><span class="swap">☾</span></button>
    </div>

    <input type="file" id="file-input" accept="application/json,.json" hidden />
    <input type="file" id="photo-input" accept="image/*" hidden />
  </header>

  <div class="ribbon glass" id="ribbon"></div>

  <main class="workspace">

    <aside class="panel glass" id="panel">
      <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="content" role="tab">contenido</button>
        <button class="tab" data-tab="design" role="tab">diseño</button>
        <button class="tab" data-tab="templates" role="tab">plantillas</button>
        <button class="tab" data-tab="review" role="tab">análisis</button>
        <button class="tab" data-tab="help" role="tab">ayuda</button>
      </nav>

      <div class="panel-scroll">
        <div class="tabpane is-active" id="pane-content"></div>
        <div class="tabpane" id="pane-design"></div>
        <div class="tabpane" id="pane-templates"></div>
        <div class="tabpane" id="pane-review"></div>
        <div class="tabpane" id="pane-help"></div>
      </div>
    </aside>

    <section class="stage glass">
      <div class="stage-bar">
        <div class="zoom">
          <button class="icon-btn" data-action="zoom-out" aria-label="−">−</button>
          <span class="zoom-value" id="zoom-value">100%</span>
          <button class="icon-btn" data-action="zoom-in" aria-label="+">+</button>
          <button class="icon-btn" data-action="zoom-fit">fit</button>
        </div>
        <div class="stage-meta">
          <span id="page-count">1</span>
          <span class="meter" id="fill-meter"><i style="width:0%"></i></span>
          <button class="icon-btn only-mobile" data-action="toggle-panel">editor</button>
        </div>
      </div>

      <div class="stage-scroll" id="stage-scroll">
        <div class="paper-scaler" id="paper-scaler">
          <article id="cv-root" class="cv cv-live"></article>
        </div>
      </div>
    </section>

  </main>

  <div class="toast" id="toast"></div>
</div>

<style id="dynamic-print-style"></style>

<script src="assets/js/core.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/docstyle.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/richtext.js"></script>
<script src="assets/js/render.js"></script>
<script src="assets/js/review.js"></script>
<script src="assets/js/panel.js"></script>
<script src="assets/js/export.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
